version: '3.8'
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: metrasure_user
      POSTGRES_PASSWORD: metrasure_password
      POSTGRES_DB: metrasure_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql+psycopg://metrasure_user:metrasure_password@db:5432/metrasure_db
    depends_on:
      - db

volumes:
  postgres_data:
